# Test Infrastructure for postgres-backup-s3cmd
#
# Provides PostgreSQL and MinIO (S3-compatible storage) for local testing.
#
# Usage:
#   docker compose -f tests/compose.test.yaml up -d
#   ./tests/run-tests.sh
#   docker compose -f tests/compose.test.yaml down -v
#
# Note: MinIO does NOT reproduce the Ceph checksum bug.
# For Ceph validation, use tests/test-external-s3.sh with a real Ceph endpoint.

name: postgres-backup-test

services:
  # PostgreSQL database for testing
  postgres:
    image: postgres:17-alpine
    container_name: backup-test-postgres
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - backup-test

  # MinIO S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: backup-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"   # API (using 9002 to avoid conflicts)
      - "9003:9001"   # Console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - minio_test_data:/data
    networks:
      - backup-test

  # Initialize MinIO bucket
  minio-init:
    image: minio/mc:latest
    container_name: backup-test-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/test-backups;
      mc anonymous set none local/test-backups;
      echo 'MinIO bucket initialized';
      "
    networks:
      - backup-test

networks:
  backup-test:
    driver: bridge

volumes:
  postgres_test_data:
  minio_test_data:
