# Build and push Docker images for postgres-backup-s3cmd
#
# This workflow builds multi-arch images (amd64, arm64) for each
# supported PostgreSQL major version and pushes to DockerHub.
#
# Triggers:
# - Push to main branch: builds dev images (sha-xxx, main)
# - Tags (v*): builds and pushes production images
# - Pull request: builds only (no push)
# - Manual trigger: builds and pushes images
#
# Image tagging strategy:
# - Production (tags only):  18, 17, 16, 15, v0.1.0-pg18
# - Development (main):      sha-abc123f, main

name: Build and Push Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: stefanmarkmann/postgres-backup-s3cmd

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: 18
            alpine: "3.23.4"
          - pg: 17
            alpine: "3.23.2"
          - pg: 16
            alpine: "3.23.2"
          - pg: 15
            alpine: "3.22.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tag strategy
        id: tag_strategy
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            version_no_v="${GITHUB_REF#refs/tags/v}"
            echo "version_no_v=${version_no_v}" >> $GITHUB_OUTPUT
            major="$(echo "${version_no_v}" | cut -d. -f1)"
            minor="$(echo "${version_no_v}" | cut -d. -f2)"
            echo "major=${major}" >> $GITHUB_OUTPUT
            echo "major_minor=${major}.${minor}" >> $GITHUB_OUTPUT
            echo "build_version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            sha_short="$(echo ${{ github.sha }} | cut -c1-7)"
            echo "sha_short=${sha_short}" >> $GITHUB_OUTPUT
            echo "build_version=sha-${sha_short}" >> $GITHUB_OUTPUT
          fi

          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker (production tags)
        id: meta_prod
        if: steps.tag_strategy.outputs.is_release == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Short PG version tag (e.g., 17)
            type=raw,value=${{ matrix.pg }}
            # Version + PG tags (e.g., v1-pg17, v1.0-pg17, v1.0.0-pg17)
            type=raw,value=v${{ steps.tag_strategy.outputs.major }}-pg${{ matrix.pg }}
            type=raw,value=v${{ steps.tag_strategy.outputs.major_minor }}-pg${{ matrix.pg }}
            type=raw,value=${{ steps.tag_strategy.outputs.version }}-pg${{ matrix.pg }}

      - name: Extract metadata for Docker (dev tags)
        id: meta_dev
        if: steps.tag_strategy.outputs.is_release != 'true' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # SHA tag (e.g., sha-abc123f-pg17)
            type=raw,value=sha-${{ steps.tag_strategy.outputs.sha_short }}-pg${{ matrix.pg }}
            # Main branch tag (e.g., main-pg17)
            type=raw,value=main-pg${{ matrix.pg }}

      - name: Extract metadata for Docker (PR tags)
        id: meta_pr
        if: github.event_name == 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # PR tag (local build only; not pushed)
            type=raw,value=pr-${{ github.event.pull_request.number }}-pg${{ matrix.pg }}
            # SHA tag (e.g., sha-abc123f-pg17)
            type=raw,value=sha-${{ steps.tag_strategy.outputs.sha_short }}-pg${{ matrix.pg }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine }}
            PG_MAJOR=${{ matrix.pg }}
            BUILD_VERSION=${{ steps.tag_strategy.outputs.build_version }}
            BUILD_DATE=${{ steps.tag_strategy.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.meta_prod.outputs.tags || steps.meta_dev.outputs.tags || steps.meta_pr.outputs.tags }}
          labels: ${{ steps.meta_prod.outputs.labels || steps.meta_dev.outputs.labels || steps.meta_pr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Update DockerHub repository description
  update-description:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update DockerHub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./README.md
          short-description: "Simple PostgreSQL dump backups to S3-compatible storage using s3cmd"

  cleanup-dev-tags:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: 18
          - pg: 17
          - pg: 16
          - pg: 15
    steps:
      - name: Resolve Docker Hub repo
        id: repo
        run: |
          namespace="${IMAGE_NAME%%/*}"
          repo="${IMAGE_NAME#*/}"
          echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Get Docker Hub token
        id: hub_token
        run: |
          token="$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"${DOCKERHUB_USERNAME}\", \"password\": \"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Failed to get Docker Hub token" >&2
            exit 1
          fi
          echo "token=${token}" >> "$GITHUB_OUTPUT"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Delete dev tags
        run: |
          sha_short="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          tags=(
            "main-pg${{ matrix.pg }}"
            "sha-${sha_short}-pg${{ matrix.pg }}"
          )
          for tag in "${tags[@]}"; do
            code="$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: JWT ${{ steps.hub_token.outputs.token }}" \
              "https://hub.docker.com/v2/repositories/${{ steps.repo.outputs.namespace }}/${{ steps.repo.outputs.repo }}/tags/${tag}/")"
            if [ "$code" = "404" ]; then
              echo "Tag ${tag} not found; skipping"
              continue
            fi
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "Failed to delete tag ${tag} (HTTP ${code})" >&2
              exit 1
            fi
            echo "Deleted tag ${tag}"
          done
