# postgres-backup-s3cmd Kubernetes Secret
#
# Template for storing backup credentials.
# Replace base64-encoded values with your actual credentials.
#
# Generate base64 values:
#   echo -n 'your-value' | base64
#
# Apply:
#   kubectl apply -f secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-secret
  labels:
    app: postgres-backup
type: Opaque
data:
  # PostgreSQL credentials
  # echo -n 'your-password' | base64
  POSTGRES_PASSWORD: Y2hhbmdlLW1l

  # S3 credentials
  # echo -n 'your-access-key' | base64
  S3_ACCESS_KEY_ID: Y2hhbmdlLW1l
  # echo -n 'your-secret-key' | base64
  S3_SECRET_ACCESS_KEY: Y2hhbmdlLW1l

  # Optional: GPG passphrase for encryption
  # echo -n 'your-passphrase' | base64
  # PASSPHRASE: Y2hhbmdlLW1l
